# 生产形态运行配置（本地替身验证用，不是真实生产环境）
#
# 用法：
#   java -jar hospital-review-demo-1.0.0.jar --spring.profiles.active=prod
# 必须同时提供数据库与存储配置；未提供时启动会失败，不会静默回落到演示配置。
#
# 安全边界：
#   - review.profile=prod 时一律拒绝 X-Demo-Role 请求头，只接受 Authorization: Bearer。
#   - 当前 TokenAuthenticator 为本地替身，一律返回未认证；接入 OIDC/LDAP 前 prod 不可用。

spring.datasource.url=${REVIEW_DB_URL:jdbc:postgresql://127.0.0.1:5432/review}
spring.datasource.username=${REVIEW_DB_USER:review_app}
spring.datasource.password=${REVIEW_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

review.profile=prod
review.storage-dir=${REVIEW_STORAGE_DIR:./.runtime/v2-evidence}
demo.upload-dir=${REVIEW_UPLOAD_DIR:./.runtime/uploads}

server.address=${REVIEW_BIND:127.0.0.1}
server.port=${REVIEW_PORT:18080}
server.error.include-message=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
